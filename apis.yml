aid: teabot
name: teaBOT
description: teaBOT is a Toronto-based hardware startup (Y Combinator, Summer 2015)
  that builds an automated loose-leaf tea-making robot offered to offices, showrooms,
  and lounges as an amenity-as-a-service. For a flat monthly fee, teams use the companion
  teaBOT app to explore premium teas and dispense a custom-blended cup in under 30
  seconds, which companies such as Google, HubSpot, and McKinsey use as a workplace
  recruiting and retention perk. Founded by robotics PhD Rehman Merali, teaBOT runs
  a physical-product and mobile-app business and does not currently publish a public
  developer API, SDKs, or OpenAPI surface.
